name: gg_parse_stdout
description: Provides methods to extract pathes from command line output in a vscode compatible form.
version: 1.2.0
repository: https://github.com/inlavigo/gg_parse_stdout.git

environment:
  sdk: ">=3.14.0 <4.0.0"

dependencies:
  args: ^2.7.0
  colorize: ^3.0.0
  gg_args: ^3.2.1
  gg_process: ^1.5.0
  path: ^1.9.1

dev_dependencies:
  dna_ggsuite: ^2.0.0
  gg_capture_print: ^1.2.1
  helix: ^1.15.2
  lints: ^6.1.0
  test: ^1.33.0